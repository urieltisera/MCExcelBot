[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-excel-telegram"
version = "0.1.0"
description = "Generador y digitalizador de planillas mediante Telegram"
requires-python = ">=3.11"
dependencies = [
    "qrcode[pil]",
    "openpyxl>=3.1,<4",
    "python-telegram-bot==22.8",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "google-genai>=1.0,<2",
    "opencv-python-headless>=4.10,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot_excel = ["assets/*.png"]

[tool.pytest.ini_options]
pythonpath = ["src"]
